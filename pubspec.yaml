name: eigen_flutter
description: "Eigen Engine — whitelabel Flutter client for turn-based multiplayer games on the Eigen server."
version: 0.1.0
homepage: https://eigeninteractive.com
repository: https://github.com/eigeninteractive/eigen-flutter
documentation: https://eigeninteractive.com/docs/client/overview
issue_tracker: https://github.com/eigeninteractive/eigen-flutter/issues

# `cider` keeps CHANGELOG.md and the version above in step, Keep-a-Changelog
# style. Add entries as you work (`cider log added "…"`), then at release time
# `cider bump minor && cider release` moves everything under `## [Unreleased]`
# into a dated, linked section and bumps the version here.
cider:
  link_template:
    tag: https://github.com/eigeninteractive/eigen-flutter/releases/tag/%tag%
    diff: https://github.com/eigeninteractive/eigen-flutter/compare/%from%...%to%
    version: v%version%

environment:
  sdk: ^3.9.2
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_sign_in: ^7.2.0
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  go_router: ^17.2.1
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  shared_preferences: ^2.5.4
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  infinite_scroll_pagination: ^5.1.1
  intl: ^0.20.2
  image_picker: ^1.2.2
  image_cropper: ^12.2.1
  share_plus: ^13.1.0
  flutter_native_splash: ^2.4.7
  in_app_update: ^4.2.5
  in_app_review: ^2.0.11
  connectivity_plus: ^7.1.1
  firebase_core: ^4.9.0
  firebase_analytics: ^12.4.1
  firebase_crashlytics: ^5.2.2
  firebase_messaging: ^16.2.2
  firebase_app_installations: ^0.4.2+4
  flutter_local_notifications: ^21.0.0
  app_settings: ^7.0.0
  url_launcher: ^6.3.2
  riverpod_sqflite: ^0.4.3
  sqflite: ^2.4.2+1
  path: ^1.9.1
  package_info_plus: ^10.1.0
  qr_flutter: ^4.1.0
  # Released in lockstep with this package; see CONTRIBUTING.md.
  eigen_api: ^0.1.0
  dio: ^5.10.0
  dio_smart_retry: ^7.0.1
  firebase_auth: ^6.5.6
  web_socket_channel: ^3.0.3

# Development only. `dependency_overrides` is honoured just for the root
# package, so this points at the local checkout while you work and is ignored
# entirely by any app that depends on eigen_flutter. It is what lets the
# generated client keep its own independent resolution — a pub workspace
# would force one shared resolution, and eigen_api's build_runner needs a
# newer analyzer than riverpod_lint allows.
dependency_overrides:
  eigen_api:
    path: packages/eigen_api

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.4
  riverpod_lint: ^3.1.4
  json_serializable: ^6.13.0
  freezed: ^3.2.5
  checks: ^0.3.1

flutter:
  uses-material-design: true

  # Inter is bundled as a package font so consuming apps get it automatically
  # and it renders offline from the first frame (no runtime fetch). All weights
  # are declared so Flutter's weight matching is exact (no faux-bold). Regenerate
  # the files with tool/download_fonts.sh.
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Thin.ttf
          weight: 100
        - asset: fonts/Inter-ExtraLight.ttf
          weight: 200
        - asset: fonts/Inter-Light.ttf
          weight: 300
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
        - asset: fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: fonts/Inter-Black.ttf
          weight: 900
