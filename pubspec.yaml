name: eigen_engine
description: "Eigen Engine — whitelabel Flutter + Supabase engine for turn-based multiplayer games."
publish_to: 'none'
version: 1.3.0

environment:
  sdk: ^3.9.2
  flutter: ">=3.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.0.0
  google_sign_in: ^7.2.0
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  go_router: ^17.2.1
  google_fonts: ^8.1.0
  json_annotation: ^4.11.0
  freezed_annotation: ^3.1.0
  shared_preferences: ^2.5.4
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  infinite_scroll_pagination: ^5.1.1
  intl: ^0.20.2
  image_picker: ^1.2.2
  image_cropper: ^12.2.1
  share_plus: ^13.1.0
  flutter_native_splash: ^2.4.7
  in_app_update: ^4.2.5
  in_app_review: ^2.0.11
  connectivity_plus: ^7.1.1
  firebase_core: ^4.9.0
  firebase_analytics: ^12.4.1
  firebase_crashlytics: ^5.2.2
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^21.0.0
  app_settings: ^7.0.0
  url_launcher: ^6.3.2
  riverpod_sqflite: ^0.4.2
  sqflite: ^2.4.2+1
  path: ^1.9.1
  package_info_plus: ^10.1.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.3
  riverpod_lint: ^3.1.3
  json_serializable: ^6.13.0
  freezed: ^3.2.5

flutter:
  uses-material-design: true
