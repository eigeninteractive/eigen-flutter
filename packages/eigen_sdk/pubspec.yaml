name: eigen_sdk
description: Pure-Dart transport SDK for the Eigen server — the generated REST client and the hand-written frame-stream socket.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.2

# Share the workspace's resolution + lockfile (rooted at eigen-flutter/).
resolution: workspace

dependencies:
  # REST client + models are generated from the server's openapi.json in Stage 1
  # (generator bake-off). web_socket_channel is added when the socket layer lands.

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
