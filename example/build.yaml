# Codegen settings for the game's payload types.
#
# There is deliberately **no `field_rename`**. The JSON keys are whatever the
# TypeScript schemas declare, and this game's are camelCase (`yourMove`,
# `lastRound`, `targetWins`) — so the Dart field names are already the wire
# keys and renaming them would silently break the codec.
#
# This matches the engine itself: the whole wire vocabulary is camelCase, so
# neither the framework package one directory up nor the generated `eigen_api`
# client sets `field_rename`. Keep your game's schemas camelCase too and the
# Dart mirror stays a straight transcription; the twin fixtures carry the real
# wire keys and will catch any drift.
targets:
  $default:
    builders:
      json_serializable:
        options:
          explicit_to_json: true
          # Wrap decode failures in `CheckedFromJsonException`, which names the
          # offending field. A game payload that fails to parse is a twin-drift
          # bug report, and "yourMove: dynamite is not one of the supported
          # values" is a far better one than a bare ArgumentError. The generated
          # `eigen_api` client uses the same setting.
          checked: true
