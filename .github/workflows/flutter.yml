name: Flutter

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Validates the Flutter/Dart engine package in isolation so `main` stays green
# for the apps that depend on it. No secrets needed — the engine reads no
# env/Firebase config itself (apps inject runtime config via EngineConfig).
# The server it talks to is validated in the eigen-server repo's own CI.

jobs:
  analyze:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Generate code
        run: dart run build_runner build

      - name: Apply fixes
        run: dart fix --apply

      - name: Check no pending fixes
        run: git diff --exit-code

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
