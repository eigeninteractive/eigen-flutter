name: Release

# Publishes `eigen_flutter` to pub.dev on a version tag.
#
#   cider bump minor && cider release   # updates CHANGELOG.md + pubspec version
#   git tag v0.1.0 && git push origin v0.1.0
#
# Tag-triggered rather than push-triggered because that is what pub.dev's
# automated publishing requires: it trusts a GitHub OIDC token only when the
# token's ref is a TAG matching the pattern configured on the package, set at
# Admin → Automated publishing to repository `eigeninteractive/eigen-flutter`,
# tag pattern `v{{version}}`. No pub credential is stored in GitHub secrets at
# all: the OIDC identity IS the authentication.
#
# One package. `eigen_api`, the generated REST client, is published by the
# ENGINE repo (eigen-server/clients/dart), because that is where the wire
# contract lives. This package consumes it as an ordinary versioned dependency,
# so the two release independently.
#
# Generated code (`*.g.dart`, `*.freezed.dart`) is committed, so the tarball
# compiles for consumers and publishing needs no `.pubignore`; `dart pub
# publish` falls back to `.gitignore`, which excludes build output and
# credentials while keeping the generated sources. `checks.yml` proves that
# committed output is current, so nothing is regenerated below.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  # Required for pub.dev's OIDC-based automated publishing.
  id-token: write

jobs:
  # The same gate every pull request clears, re-run against the tagged commit.
  # A tag can point at any commit, so this is a fresh execution rather than a
  # lookup of whatever the branch run concluded. Sharing the definition, not
  # re-typing format/analyze/test here, is the point: a check added to
  # checks.yml automatically guards releases too.
  gate:
    name: Checks
    uses: ./.github/workflows/checks.yml

  publish:
    name: Publish to pub.dev
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Tag matches pubspec version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          [ "$tag" = "$pkg" ] || {
            echo "::error::tag v$tag does not match pubspec version $pkg"; exit 1; }

      # The published package must resolve against the REAL eigen_api on
      # pub.dev, not the local checkout `dependency_overrides` points at. A
      # publish that silently used the override would ship a package whose
      # constraint has never been tested.
      - name: No dependency overrides in the published manifest
        run: |
          grep -q '^dependency_overrides:' pubspec.yaml && {
            echo "::error file=pubspec.yaml::dependency_overrides is still active. Remove it before tagging a release."; exit 1; }
          exit 0

      # Makes the pipeline idempotent. `dart pub publish` fails on a version
      # that already exists, which turns every harmless re-run (a retried job,
      # a re-pushed tag, a version published by hand before this automation
      # existed) into a red release someone has to explain.
      #
      # Checking first turns those into a clean skip, and keeps the state that
      # matters (what is on pub.dev) authoritative over the state that does not
      # (which refs happen to exist in this repository).
      - name: Is this version already on pub.dev?
        id: published
        run: |
          v=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          if curl -sf https://pub.dev/api/packages/eigen_flutter \
               | jq -e --arg v "$v" '.versions[] | select(.version == $v)' >/dev/null; then
            echo "::notice::eigen_flutter $v is already on pub.dev. Skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # `permissions.id-token: write` above only makes an OIDC token
      # OBTAINABLE. Something still has to exchange it for a pub credential,
      # and nothing here did.
      #
      # `dart-lang/setup-dart` does this exchange for you, which is why the
      # pub.dev instructions never mention it, but this job installs the SDK
      # through `subosito/flutter-action`, because publishing a Flutter package
      # needs the Flutter SDK, and that action has no equivalent step.
      #
      # The failure mode is unusually bad: `dart pub publish` finds no
      # credential, falls back to INTERACTIVE OAuth, prints an
      # accounts.google.com URL, and blocks on "Waiting for your
      # authorization..." until the job times out. It does not fail fast, and
      # nothing in the output says the word "OIDC".
      #
      # This is exactly what setup-dart does internally: mint a token for the
      # https://pub.dev audience, then point pub's credential store at it.
      - name: Authenticate to pub.dev with this workflow's OIDC identity
        if: steps.published.outputs.skip == 'false'
        run: |
          PUB_TOKEN=$(curl --retry 5 --retry-connrefused -sLS \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://pub.dev" \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | jq -r '.value')

          [ -n "$PUB_TOKEN" ] && [ "$PUB_TOKEN" != "null" ] || {
            echo "::error::could not mint an OIDC token for pub.dev; publishing would fall back to an interactive prompt and hang"
            exit 1
          }

          echo "::add-mask::$PUB_TOKEN"
          echo "PUB_TOKEN=$PUB_TOKEN" >> "$GITHUB_ENV"
          export PUB_TOKEN
          dart pub token add https://pub.dev --env-var PUB_TOKEN

      # Surfaces score-affecting problems (missing docs, unresolved links,
      # platform support) before they are permanent; pub.dev versions cannot be
      # unpublished, only retracted.
      - name: Dry run
        if: steps.published.outputs.skip == 'false'
        run: dart pub publish --dry-run

      - name: Publish
        if: steps.published.outputs.skip == 'false'
        run: dart pub publish --force

      # eigen-web publishes the compatibility table, which engine line each
      # `eigen_flutter` release speaks, and pub.dev is the authority for it.
      # Nothing over there can notice a publish on its own, so tell it.
      #
      # NOT gated on `skip`: a re-run after a failed dispatch is exactly when
      # this needs to fire, and the publish having already succeeded is the
      # reason. Regenerating when nothing changed opens no pull request, so a
      # redundant dispatch costs a few seconds and nothing else.
      #
      # The version travels in the payload because pub.dev serves a publish from
      # its API a moment after the call returns. The receiving workflow waits for
      # this exact version rather than reading whatever is there when it happens
      # to start, or else it would regenerate from the state just before this
      # release and silently produce no change at all.
      #
      # Failing here fails the release, matching eigen-server: a published client
      # with an unnotified docs site is a state worth stopping on. The recovery
      # is the `Sync compatibility table` workflow's manual trigger.
      #
      # GITHUB_TOKEN cannot do this; it is scoped to the repository that minted
      # it, same organization or not, so this needs the App. Its credentials
      # must exist HERE (`RELEASE_APP_CLIENT_ID` variable,
      # `RELEASE_APP_PRIVATE_KEY` secret) and it must be installed on eigen-web.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: eigen-web
          permission-contents: write # POST /dispatches counts as a write on the target

      - name: Notify eigen-web
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          v=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          gh api "repos/$OWNER/eigen-web/dispatches" \
            -f event_type=flutter-client-released \
            -f "client_payload[version]=$v"
          echo "::notice::Told eigen-web that eigen_flutter $v is published."
