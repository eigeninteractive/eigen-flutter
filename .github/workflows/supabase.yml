name: Supabase

# Everything that validates the engine's Supabase backend, path-scoped to
# `supabase/**` so Dart-only PRs skip it entirely. Two jobs:
#   - lint:          deno fmt + lint + type-check + unit tests over the edge
#                    functions (cheap; every supabase change, incl. TS-only
#                    ones). `deno check` resolves imports (fetches jsr deps)
#                    and type-checks each function through its own import map;
#                    `deno test` runs the pure-module suite in `_tests/`.
#   - types-in-sync: boots the stack, regenerates the engine-owned DB types from
#                    the live schema, and fails on any diff with the committed
#                    file — so migrations and `_types/database.types.ts` can't drift.
#
# NOTE on types-in-sync: it boots Docker (~2-3 min) and runs on any supabase/**
# change, including pure-TS ones that can't affect generated types. If that cost
# bites, gate it on `supabase/migrations/**` with a paths-filter step. It is also
# red until the committed types are a real generation — run
# `./bin/setup_local.sh && supabase start && ./bin/generate_db_types.sh` and
# commit the result (the repo ships an enums-only baseline).

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'bin/setup_local.sh'
      - 'bin/generate_db_types.sh'
      - '.github/workflows/supabase.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'bin/setup_local.sh'
      - 'bin/generate_db_types.sh'
      - '.github/workflows/supabase.yml'

jobs:
  lint:
    name: Edge functions (deno fmt + lint + check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2

      - name: Format check
        run: deno fmt --check supabase/functions

      - name: Lint
        run: deno lint supabase/functions

      # Type-check each deployable function through its own import map.
      # Deployable functions are exactly the dirs with a deno.json (the shared
      # `_engine` framework has none); each has an index.ts entrypoint. `game`
      # transitively checks its vendored harness + game.ts + the whole _engine
      # framework. Discovered by glob so new functions need no edit here.
      - name: Type check
        run: |
          for cfg in supabase/functions/*/deno.json; do
            deno check --config "$cfg" "$(dirname "$cfg")/index.ts"
          done

      # Pure-module unit tests in `_tests/` (type-checked by `deno test`
      # itself). --allow-read: the twin-drift suite loads the shared JSON
      # fixtures; --allow-env: bot_auth signs with an env-var secret.
      - name: Unit tests
        run: |
          deno test --config supabase/functions/deno.json \
            --allow-read --allow-env supabase/functions/_tests/

  types-in-sync:
    name: DB types in sync with migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Intentionally unpinned: if a new CLI version changes `gen types`
          # output, this job fails — surfacing the change so you regenerate
          # (./bin/generate_db_types.sh) with the matching CLI and commit the result.
          version: latest

      - uses: denoland/setup-deno@v2

      - name: Bootstrap local secrets (signing key + env)
        run: bash bin/setup_local.sh

      - name: Start Supabase (applies migrations)
        run: supabase start

      - name: Regenerate engine DB types
        run: bash bin/generate_db_types.sh

      - name: Fail if types drift from migrations
        run: |
          git diff --exit-code -- supabase/functions/_types/database.types.ts \
            || { echo "::error::database.types.ts is out of sync with the migrations. Run ./bin/generate_db_types.sh and commit."; exit 1; }
